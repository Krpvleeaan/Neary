<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0D1117; }
        #map { width: 100%; height: 100%; }

        /* Dark theme for OSM tiles via CSS filter */
        .leaflet-tile-pane { filter: brightness(0.7) invert(1) contrast(1.1) hue-rotate(200deg) saturate(0.4) brightness(0.8); }
        .leaflet-control-attribution { display: none !important; }
        .leaflet-control-zoom { display: none !important; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([55.751244, 37.618423], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        var userMarker = null;
        var pulseCircle = null;

        function updatePosition(lat, lon) {
            var latlng = L.latLng(lat, lon);

            if (pulseCircle) {
                pulseCircle.setLatLng(latlng);
            } else {
                pulseCircle = L.circleMarker(latlng, {
                    radius: 18,
                    color: '#3B82F6',
                    fillColor: '#3B82F6',
                    fillOpacity: 0.15,
                    weight: 1.5,
                    opacity: 0.3
                }).addTo(map);
            }

            if (userMarker) {
                userMarker.setLatLng(latlng);
            } else {
                userMarker = L.circleMarker(latlng, {
                    radius: 7,
                    color: '#FFFFFF',
                    fillColor: '#3B82F6',
                    fillOpacity: 1,
                    weight: 2.5
                }).addTo(map);
            }

            map.setView(latlng, map.getZoom() < 14 ? 15 : map.getZoom(), { animate: true });
        }
    </script>
</body>
</html>
